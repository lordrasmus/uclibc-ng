name: z_qemu_test_run

on:
  workflow_call:

jobs:
  build:
    runs-on: [self-hosted, uclibc-build]

    steps:

      - name: Cleanup workspace (self-hosted)
        run: |
          # Build-Reste entfernen, aber das .git behalten -> actions/checkout fetcht
          # nur Deltas statt komplett neu zu klonen (spart 40-250s checkout ueber die
          # geteilte GitHub-Leitung). clean:true von checkout deckt den Rest ab.
          sudo find "${{ github.workspace }}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + 2>/dev/null || true

      - name: Install qemu / python3 junit_xml
        run: |
          # self-hosted: qemu-system, python3-junit.xml, libnfs13, libssh-gcrypt-4
          # and pybadges are pre-provisioned on the VM. apt/pip disabled because the
          # 15 parallel runners share one apt lock + one HOME on the same VM.
          # Re-enable the two lines below when switching back to GitHub-hosted.
          #sudo apt-get -y update; sudo apt-get install -y qemu-system python3-junit.xml libnfs13 libssh-gcrypt-4
          #pip3 install pybadges
          echo "qemu/test deps pre-provisioned on self-hosted runner"
      
      # wird bei xtensa für den cpio hack gebraucht
      - uses: actions/checkout@master
        with:
          fetch-depth: 1
      
      - name: upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          overwrite: true
          path: |
            .github/tools/run_qemu.py
            kernel.img
            kernel.config
            rootfs.img
            rootfs.img.xz
            infos.json  
            linux-*
            sysroot.tar  
            toolchain-*.tar.xz
            uclibc-ng-config
      
      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts
       
      - name: Infos
        run: |
           jq '.' infos.json
      
      - name: parse Config JSON
        id: parse-json
        run: |
          json=$(cat infos.json)
          for key in $(echo "$json" | jq -r 'keys[]'); do
            value=$(echo "$json" | jq -r ".$key")
            echo "$key=$value" >> "$GITHUB_ENV"
          done
  
      - name: install Qemu
        run: |
          wget -nv  "https://github.com/lordrasmus/uclibc-ng-qemu-imgs/blob/main/qemu-inst.tar.xz?raw=true" -O qemu-inst.tar.xz
          tar -xaf qemu-inst.tar.xz
      
          
      - name: run Qemu
        run: |
          if [[ $CONFIG_KERNEL_ARCH == "xtensa" ]] ;  then python3 .github/tools/xtensa-cpio-hack.py; fi
          if [[ $CONFIG_KERNEL_ARCH == "kvx" ]] ;     then python3 .github/tools/xtensa-cpio-hack.py; fi
          if [[ $CONFIG_KERNEL_ARCH == "csky" ]] ;    then python3 .github/tools/xtensa-cpio-hack.py; fi
          # ColdFire: the mcf5208evb machine has no initrd support at all, so the
          # rootfs goes into the kernel image. Keyed on the qemu machine, not on
          # the arch, because m68k also has the 68040 virt target which uses -initrd.
          # Its image carries a 24M placeholder, the m68k rootfs does not fit in 17M.
          if [[ $CONFIG_QEMU_CMD == *mcf5208* ]] ;    then python3 .github/tools/xtensa-cpio-hack.py 25165824; fi
          echo "Qemu Command : $CONFIG_QEMU_CMD"
          python3 .github/tools/run_qemu.py
           
      - name: analyse Test
        run: |
           python3 .github/tools/read_test_log.py
           cat test_summary.md >> $GITHUB_STEP_SUMMARY
        
           
      - name: upload Test
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }} 
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }} 
        run: |
           #python3 .github/tools/post_badge.py ${{ github.workflow }}_test_result.svg badge.svg
           #python3 .github/tools/post_badge.py ${{ github.workflow }}_test_result.txt log_text.txt
           
           python3 .github/tools/upload.py badge.svg    tests ${{ github.workflow }}_test_result.svg
           python3 .github/tools/upload.py log_text.txt tests ${{ github.workflow }}_test_result.txt
  
  

      - name: upload 
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test_Result
          path: |
             log.txt
 

