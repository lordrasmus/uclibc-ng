name: m68k-68020-npt-gcc-13-kernel-5.4.259-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master


concurrency:
  # Zwei Laeufe desselben Ziels duerfen sich nicht ueberholen: der Badge ist
  # eine Datei auf dem Server, es gewinnt also der, der spaeter fertig wird --
  # nicht der mit dem neueren Commit. Am 2026-08-26 hat so ein dispatch-Lauf
  # auf dem aelteren Commit den gruenen Badge eines Pushs ueberschrieben, eine
  # Minute nach ihm. Die Gruppe ist (Workflow, Ref), die Ziele laufen also
  # weiter parallel zueinander; nur derselbe Workflow reiht sich auf. Wartende
  # Laeufe belegen keinen Runner, und kommt ein dritter Trigger, verwirft
  # GitHub den wartenden und behaelt den neuesten -- fuer den Badge richtig.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-m68k_68040-gcc-13
      gcc_prefix: m68k-openadk-linux-uclibc-
      kernel_vers: 5.4.259
      kernel_dir: v5.x
      kernel_arch: m68k
      config_file: config.m68k_68020
      qemu_kernel:
      qemu_cmd:

  # Same toolchain as the 68040 target, built for the 68020 through
  # UCLIBC_EXTRA_CFLAGS="-mcpu=68020" in the config; gcc ships an m68020
  # multilib, so libgcc matches. The 68020 is the smallest core with CAS,
  # which is what bits/atomic.h keys on.
  #
  # Build only: qemu emulates the 68040 MMU, and a 68020 needs an external
  # 68851 PMMU that it does not model, so an MMU kernel does not come up with
  # -cpu m68020 (tried: no output at all, while the default 68040 boots).

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit
