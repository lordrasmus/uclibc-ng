name: riscv32-no-gcc-10-kernel-5.1.21-static-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master



jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-riscv32-gcc-10_nommu
      gcc_prefix: riscv32-openadk-linux-uclibc-
      kernel_vers: 5.1.21
      kernel_dir: v5.x
      kernel_arch: riscv
      config_file: config.riscv32-elf
      qemu_kernel: kernel-riscv32.img
      qemu_cmd: qemu-system-riscv32 -M virt -nographic -kernel kernel.img -initrd rootfs.img


  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit

  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit

  call_badge_failed:
    if: failure()
    needs: [call_build, call_images]
    uses: ./.github/workflows/z_badge_failed_workflow.yml
    with:
      build_result: ${{ needs.call_build.result }}
      images_result: ${{ needs.call_images.result }}
    secrets: inherit
