name: riscv32-no-gcc-10-kernel-6.5.10-static-nommu-flat

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-riscv32-gcc-10_nommu
      gcc_prefix: riscv32-openadk-linux-uclibc-
      kernel_vers: 6.5.10
      kernel_dir: v6.x
      kernel_arch: riscv
      config_file: config.riscv32
      qemu_kernel: kernel-riscv32-nommu.img
      qemu_cmd: qemu-system-riscv32 -M virt -nographic -bios none -kernel kernel.img -initrd rootfs.img


  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit

  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit
