name: mips32r6-le-npt-gcc-15-kernel-6.18.37-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master


concurrency:
  # Zwei Laeufe desselben Ziels duerfen sich nicht ueberholen: der Badge ist
  # eine Datei auf dem Server, es gewinnt also der, der spaeter fertig wird --
  # nicht der mit dem neueren Commit. Am 2026-08-26 hat so ein dispatch-Lauf
  # auf dem aelteren Commit den gruenen Badge eines Pushs ueberschrieben, eine
  # Minute nach ihm. Die Gruppe ist (Workflow, Ref), die Ziele laufen also
  # weiter parallel zueinander; nur derselbe Workflow reiht sich auf. Wartende
  # Laeufe belegen keinen Runner, und kommt ein dritter Trigger, verwirft
  # GitHub den wartenden und behaelt den neuesten -- fuer den Badge richtig.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-mipsel_mips32r6-gcc-15.3.0_hard
      gcc_prefix: mipsel-openadk-linux-uclibc-
      kernel_vers: 6.18.37
      kernel_dir: v6.x
      kernel_arch: mips
      config_file: config.mips32r6
      qemu_kernel: kernel-mips32r6el.img
      qemu_cmd: qemu-system-mipsel -M malta -cpu mips32r6-generic -nographic -kernel kernel.img -initrd rootfs.img

  # Release 6 of the MIPS ISA, which is not an increment but a break: lwl/lwr,
  # swl/swr, movn/movz, the branch-likely forms and the old mult/div encodings
  # are gone. The other mips targets here build MIPS32 release 1 - the 1999
  # original - so nothing was ever compiled against those removals.
  #
  # Same ABI (o32), endianness, thread model, libm variant and machine as
  # mips32-le-npt, on purpose: the ISA revision is then the only difference,
  # and a failure has one place to come from.
  #
  # uClibc-ng turned out to be mostly ready: memcpy.S and memset.S carry
  # "#if __mips_isa_rev > 5" and use align/dalign there. The MOVN/MOVZ macros
  # in sys/asm.h pick by _MIPS_ISA rather than the revision and would emit
  # instructions r6 does not have - but nothing in the tree uses them.

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit

  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit

  call_badge_failed:
    if: failure()
    needs: [call_build, call_images]
    uses: ./.github/workflows/z_badge_failed_workflow.yml
    with:
      build_result: ${{ needs.call_build.result }}
      images_result: ${{ needs.call_images.result }}
    secrets: inherit
