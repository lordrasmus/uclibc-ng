name: mips32-be-npt-gcc-15-kernel-6.1.60-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master


jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-mips_mips32-gcc-15.3.0_hard
      gcc_prefix: mips-openadk-linux-uclibc-
      kernel_vers: 6.1.60
      kernel_dir: v6.x
      kernel_arch: mips
      config_file: config.mips_shared_be
      qemu_kernel:
      qemu_cmd:

  # Buildroot's default mips is big endian o32 (BR2_mips); all three of our
  # o32 targets are little endian. Big endian o32 is its own code path in
  # uClibc-ng: the syscall convention differs from n32/n64, which are the only
  # big endian mips we build today.
  #
  # Build only: a qemu run needs a big endian malta kernel image, which we do
  # not have. call_images still builds the test suite.

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit
