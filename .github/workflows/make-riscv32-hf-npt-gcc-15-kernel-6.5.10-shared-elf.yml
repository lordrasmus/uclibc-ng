name: riscv32-hf-npt-gcc-15-kernel-6.5.10-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master


jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-riscv32_rv32imafdc-gcc-15.3.0
      gcc_prefix: riscv32-openadk-linux-uclibc-
      kernel_vers: 6.5.10
      kernel_dir: v6.x
      kernel_arch: riscv
      config_file: config.riscv32_shared
      qemu_kernel: kernel-riscv32.img
      qemu_cmd: qemu-system-riscv32 -M virt -nographic -kernel kernel.img -initrd rootfs.img

  # Buildroot's riscv32 default is RV32IMAFDC with the ilp32d ABI, while our
  # riscv32 targets are all rv32imac/ilp32, i.e. soft float.
  #
  # No new config and no new kernel image: the ABI lives entirely in the
  # toolchain, uClibc-ng only sees UCLIBC_HAS_FPU, which config.riscv32_shared
  # already sets, and kernel-riscv32.config already has CONFIG_FPU=y. Verified
  # by booting an ilp32d binary on that very image.

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit

  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit

  call_badge_failed:
    if: failure()
    needs: [call_build, call_images]
    uses: ./.github/workflows/z_badge_failed_workflow.yml
    with:
      build_result: ${{ needs.call_build.result }}
      images_result: ${{ needs.call_images.result }}
    secrets: inherit
