name: riscv32-hf-npt-gcc-15-kernel-6.5.10-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master


jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-riscv32_rv32imafdc-gcc-15.3.0
      gcc_prefix: riscv32-openadk-linux-uclibc-
      kernel_vers: 6.5.10
      kernel_dir: v6.x
      kernel_arch: riscv
      config_file: config.riscv32_shared
      qemu_kernel:
      qemu_cmd:

  # Buildroot's riscv32 default is RV32IMAFDC with the ilp32d ABI, while our
  # riscv32 targets are all rv32imac/ilp32, i.e. soft float. Same config as the
  # soft float target: the ABI lives entirely in the toolchain, uClibc-ng only
  # sees UCLIBC_HAS_FPU, which config.riscv32_shared already sets.
  #
  # Build only: qemu needs a riscv32 kernel image built for the same float ABI,
  # which we do not have. call_images still builds the test suite.

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit
