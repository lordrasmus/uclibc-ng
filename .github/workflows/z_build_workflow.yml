name: z_build_workflow

on:
  workflow_call:
    inputs:
      toolchain:
        description: 'Toolchain name'
        required: true
        type: string
      gcc_prefix:
        description: 'GCC prefix'
        required: true
        type: string
      kernel_vers:
        description: 'Kernel version'
        required: true
        type: string
      kernel_dir:
        description: 'Kernel directory'
        required: true
        type: string
      kernel_arch:
        description: 'Kernel architecture'
        required: true
        type: string
      config_file:
        description: 'Config file name'
        required: true
        type: string
      qemu_kernel:
        description: 'Qemu Kernel Image for Testsuite execution'
        required: true
        type: string
      qemu_cmd:
        description: 'Qemu Command for Testsuite execution'
        required: true
        type: string
      

jobs:
  build:
    runs-on: [self-hosted, uclibc-build]
    steps:

      - name: Cleanup workspace (self-hosted)
        run: |
          # Build-Reste entfernen, aber das .git behalten -> actions/checkout fetcht
          # nur Deltas statt komplett neu zu klonen (spart 40-250s checkout ueber die
          # geteilte GitHub-Leitung). clean:true von checkout deckt den Rest ab.
          sudo find "${{ github.workspace }}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + 2>/dev/null || true

      - uses: actions/checkout@master
        with:
          fetch-depth: 1
          
      - name: Setup
        run: |
          echo "CONFIG_TOOLCHAIN=${{ inputs.toolchain }}" >> "$GITHUB_ENV"
          echo "CONFIG_GCC_PREFIX=${{ inputs.gcc_prefix }}" >> "$GITHUB_ENV"
          echo "CONFIG_KERNEL_VERS=${{ inputs.kernel_vers }}" >> "$GITHUB_ENV"
          echo "CONFIG_KERNEL_DIR=${{ inputs.kernel_dir }}" >> "$GITHUB_ENV"
          echo "CONFIG_KERNEL_ARCH=${{ inputs.kernel_arch }}" >> "$GITHUB_ENV"
          echo "CONFIG_FILE=${{ inputs.config_file }}" >> "$GITHUB_ENV"
          echo "CONFIG_QEMU_KERNEL=${{ inputs.qemu_kernel }}" >> "$GITHUB_ENV"
          echo "CONFIG_QEMU_CMD=${{ inputs.qemu_cmd }}" >> "$GITHUB_ENV"


      - name: check uClibc-ng config
        run: |
          cp .github/configs/$CONFIG_FILE .config
          #if grep -q '# UCLIBC_HAS_OBSOLETE_BSD_SIGNAL is not set' .config;  then echo "UCLIBC_HAS_OBSOLETE_BSD_SIGNAL must be activated for tests"; exit 1; fi
          #if grep -q '# UCLIBC_HAS_OBSOLETE_SYSV_SIGNAL is not set' .config; then echo "UCLIBC_HAS_OBSOLETE_SYSV_SIGNAL must be activated for tests"; exit 1; fi
          if grep -q 'DODEBUG=y' .config;                                    then echo "DODEBUG should be deactivated"; exit 1; fi


      - name: Install dev packages
        run: |
          # self-hosted: deps pre-provisioned on the VM. apt disabled because the
          # 15 parallel runners share one apt lock on the same VM (exit 100).
          # Re-enable the two lines below when switching back to GitHub-hosted.
          #sudo apt-get update
          #sudo apt-get install tar
          echo "dev packages pre-provisioned on self-hosted runner"

      - name: Install Toolchain
        run: |
           # per-runner cache: each runner runs one job at a time, so its own
           # cache dir is never written concurrently -> no locking, no conflicts.
           CACHE="/home/runner/cache/${RUNNER_NAME:-shared}"; mkdir -p "$CACHE"
           TC="$CACHE/$CONFIG_TOOLCHAIN.tar.xz"
           if [ ! -s "$TC" ]; then
             echo "toolchain: downloading $CONFIG_TOOLCHAIN"
             wget -nv "https://github.com/lordrasmus/toolchains/blob/main/$CONFIG_TOOLCHAIN.tar.xz?raw=true" -O "$TC.part" && mv "$TC.part" "$TC"
           else
             echo "toolchain: cache hit ($TC)"
           fi
           cp "$TC" $CONFIG_TOOLCHAIN.tar.xz
           tar -xaf $CONFIG_TOOLCHAIN.tar.xz

      - name: check Toolchain files
        run: |
           if [ ! -e ${CONFIG_TOOLCHAIN}/config ] ;     then echo "Toolchain config not found" ; exit 1 ; fi
           if [ ! -e ${CONFIG_TOOLCHAIN}/os-release ] ; then echo "Toolchain os-release not found" ; exit 1 ; fi
           if [ ! -e ${CONFIG_TOOLCHAIN}/sysroot ] ;    then echo "Toolchain sysroot not found" ; exit 1 ; fi

      - name: Fix toolchain elf2flt.ld
        run: |
          # ld-elf2flt looks up elf2flt.ld via <ld-binary>/../lib/elf2flt.ld
          # which resolves to <toolchain>/usr/<target>/lib/elf2flt.ld.
          # openadk-built toolchains ship that dir as a dangling symlink
          # into the openadk build tree, which doesn't exist post-deploy
          # -> FLAT links fail. Replace the dangling link with a real
          # directory containing just elf2flt.ld (copied from sysroot,
          # where pack.py put it). Do NOT make this point at the full
          # sysroot lib dir: that would expose a second copy of libc.a
          # to the default lib search path and conflict with the freshly
          # built uClibc-ng (e.g. TLS-vs-non-TLS mismatches in aarch64).
          # No-op for toolchains where the link is already valid or the
          # glob does not match.
          shopt -s nullglob
          for L in "$CONFIG_TOOLCHAIN"/usr/*-linux-uclibc/lib; do
            if [ -L "$L" ] && [ ! -e "$L" ]; then
              rm "$L"
              mkdir -p "$L"
              SCRIPT="$CONFIG_TOOLCHAIN/sysroot/usr/lib/elf2flt.ld"
              [ -f "$SCRIPT" ] && cp "$SCRIPT" "$L/"
              echo "replaced dangling: $L (with elf2flt.ld only)"
            fi
          done
          true

      - name: add PATH
        run: echo "$(pwd)/$CONFIG_TOOLCHAIN/usr/bin/" >> $GITHUB_PATH
      
      
      - name: gen Infos
        run: |
          ./.github/workflows/build_infos.sh .config ${{ github.workflow }}
          jq '.' artifacts/infos.json
          echo "### Build Config :bulb:" >> $GITHUB_STEP_SUMMARY
          json=$(cat artifacts/infos.json)
          for key in $(echo "$json" | jq -r 'keys[]'); do
            value=$(echo "$json" | jq -r ".$key")
            echo "$key=$value" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Extract Kernel Headers
        run: |
          # per-runner cache for the (large) kernel tarballs, same scheme as the toolchain
          CACHE="/home/runner/cache/${RUNNER_NAME:-shared}"; mkdir -p "$CACHE"
          if [[ $CONFIG_KERNEL_VERS == "kvx" ]] ; then
            DEST=linux-kvx.tar.xz
            URL="https://media.githubusercontent.com/media/lordrasmus/toolchains/main/linux-kvx.tar.xz"
          else
            DEST=linux-$CONFIG_KERNEL_VERS.tar.xz
            URL="https://cdn.kernel.org/pub/linux/kernel/$CONFIG_KERNEL_DIR/linux-$CONFIG_KERNEL_VERS.tar.xz"
          fi
          K="$CACHE/$DEST"
          if [ ! -s "$K" ]; then
            echo "kernel: downloading $DEST"
            wget -nv "$URL" -O "$K.part" && mv "$K.part" "$K"
          else
            echo "kernel: cache hit ($K)"
          fi
          cp "$K" "$DEST"
          tar -xaf "$DEST"
     
      
           
      - name: copy Artifacts
        run: |
          mkdir -p artifacts
          cp .config artifacts/uclibc-ng-config 
          cp $CONFIG_TOOLCHAIN.tar.xz artifacts
          cp linux-$CONFIG_KERNEL_VERS.tar.xz artifacts
        
      - name: upload prebuild Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts
          overwrite: true
          
      
     
         
      
      - name: Install Kernel Headers
        run: |
          echo "\nKernel : $CONFIG_KERNEL_VERS   Arch : $CONFIG_KERNEL_ARCH \n" > build.log
          make -C linux-$CONFIG_KERNEL_VERS/ INSTALL_HDR_PATH=$(pwd)/artifacts/sysroot/usr/ headers_install ARCH=$CONFIG_KERNEL_ARCH 2>&1 | tee -a build.log
          
      - name: Copy GCC Libs
        run: |
          mkdir -p artifacts/sysroot/usr/lib/
          #find $CONFIG_TOOLCHAIN/sysroot
          if [ -e $CONFIG_TOOLCHAIN/sysroot/usr/lib/libatomic.a ] ; then cp $CONFIG_TOOLCHAIN/sysroot/usr/lib/libatomic* artifacts/sysroot/usr/lib/ ; fi
          if [ -e $CONFIG_TOOLCHAIN/sysroot/usr/lib/libgcc_s.so ] ; then cp $CONFIG_TOOLCHAIN/sysroot/usr/lib/libgcc* artifacts/sysroot/usr/lib/ ; fi
          ls artifacts/sysroot/
          ( cd artifacts/sysroot/; ln -s lib lib32; ln -s lib lib64; ln -s lib libx32; )
          ( cd artifacts/sysroot/usr; ln -s lib lib32; ln -s lib lib64; ln -s lib libx32; )
          #if [ -e artifacts/sysroot/lib ] ; then find artifacts/sysroot/lib; fi
          #if [ -e artifacts/sysroot/usr/lib ] ; then find artifacts/sysroot/usr/lib ; fi
          #find artifacts/sysroot/

      - name: Build
        run: |
          sed -i 's|KERNEL_HEADERS=.*|KERNEL_HEADERS="artifacts/sysroot/usr/include"|g'  .config
          echo "\n----------------- uClibc-ng log -------------------------- \n" > build.log
          # FLAT (bFLT) builds need elf2flt invocation at link time. For
          # rv32/rv64 the compiler also needs -fPIC so the linker emits
          # R_RISCV_RELATIVE for GOT slots — without it elf2flt has no
          # source for the GOT relocs and binfmt_flat can't fix them up
          # at load time (init crashes early with a store fault).
          # Mirrors openadk's mk/vars.mk treatment of ADK_TARGET_BINFMT_FLAT.
          EXTRA=""
          if grep -q '^UCLIBC_FORMAT_FLAT=y' .config; then
            EXTRA="-Wl,-elf2flt=-r"
            if grep -qE '^TARGET_ARCH="?riscv(32|64)"?' .config; then
              EXTRA="-fPIC $EXTRA"
            fi
            echo "FLAT build: passing UCLIBC_EXTRA_CFLAGS='$EXTRA' to make" | tee -a build.log
          fi
          CROSS_COMPILE=$CONFIG_GCC_PREFIX make UCLIBC_EXTRA_CFLAGS="$EXTRA" oldconfig
          CROSS_COMPILE=$CONFIG_GCC_PREFIX make UCLIBC_EXTRA_CFLAGS="$EXTRA" -j8 2>&1 | tee -a build.log
          CROSS_COMPILE=$CONFIG_GCC_PREFIX make UCLIBC_EXTRA_CFLAGS="$EXTRA" install DESTDIR=artifacts/sysroot


      

      - name: copy Sysroot
        run: |
          ( cd artifacts ; tar -cf sysroot.tar sysroot ; rm -rf sysroot )
          cp .config uclibc-ng.config.config

      - name: upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts
          overwrite: true
      
      - name: upload build.log
        uses: actions/upload-artifact@v4
        with:
          name: build.log
          path: build.log
      
      - name: upload uClibc-ng Config
        uses: actions/upload-artifact@v4
        with:
          name: config
          path: uclibc-ng.config.config
          
       

