name: m68k-cf5208-no-gcc-15-kernel-6.18.37-static-nommu-flat

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master



jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-m68k_cf5208-gcc-15.3.0_nommu_flat_static
      gcc_prefix: m68k-openadk-uclinux-uclibc-
      kernel_vers: 6.18.37
      kernel_dir: v6.x
      kernel_arch: m68k
      config_file: config.m68k_cf_nommu
      qemu_kernel: kernel-m68k-cf5208.img
      qemu_cmd: qemu-system-m68k -nographic -M mcf5208evb -cpu m5208 -kernel kernel.img -m 512

  # Built for cf5208 because that is the core qemu runs. Do not reach for the
  # cf51 toolchain here: -mcpu=51 is ISA C (the small V1 core carries the
  # richer ISA) while the m5208 is ISA A+, and the ISAs are incremental, so
  # cf51 code may hold instructions this machine rejects. Ask gcc with
  # -mcpu=X -dM -E -, the core number says nothing about the ISA.

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit

  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit
