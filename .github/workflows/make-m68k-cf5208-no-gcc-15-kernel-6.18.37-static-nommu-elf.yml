name: m68k-cf5208-no-gcc-15-kernel-6.18.37-static-nommu-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master



concurrency:
  # Zwei Laeufe desselben Ziels duerfen sich nicht ueberholen: der Badge ist
  # eine Datei auf dem Server, es gewinnt also der, der spaeter fertig wird --
  # nicht der mit dem neueren Commit. Am 2026-08-26 hat so ein dispatch-Lauf
  # auf dem aelteren Commit den gruenen Badge eines Pushs ueberschrieben, eine
  # Minute nach ihm. Die Gruppe ist (Workflow, Ref), die Ziele laufen also
  # weiter parallel zueinander; nur derselbe Workflow reiht sich auf. Wartende
  # Laeufe belegen keinen Runner, und kommt ein dritter Trigger, verwirft
  # GitHub den wartenden und behaelt den neuesten -- fuer den Badge richtig.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-m68k_cf5208-gcc-15.3.0_nommu_elf_static
      gcc_prefix: m68k-openadk-linux-uclibc-
      kernel_vers: 6.18.37
      kernel_dir: v6.x
      kernel_arch: m68k
      config_file: config.m68k_cf5208_elf_nommu
      qemu_kernel: kernel-m68k-cf5208.img
      qemu_cmd: qemu-system-m68k -nographic -M mcf5208evb -cpu m5208 -kernel kernel.img -m 512

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit

  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit

  call_badge_failed:
    if: failure()
    needs: [call_build, call_images]
    uses: ./.github/workflows/z_badge_failed_workflow.yml
    with:
      build_result: ${{ needs.call_build.result }}
      images_result: ${{ needs.call_images.result }}
    secrets: inherit
