name: xtensa-le-hf-npt-gcc-17-kernel-6.5.10-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master


concurrency:
  # Zwei Laeufe desselben Ziels duerfen sich nicht ueberholen: der Badge ist
  # eine Datei auf dem Server, es gewinnt also der, der spaeter fertig wird --
  # nicht der mit dem neueren Commit. Am 2026-08-26 hat so ein dispatch-Lauf
  # auf dem aelteren Commit den gruenen Badge eines Pushs ueberschrieben, eine
  # Minute nach ihm. Die Gruppe ist (Workflow, Ref), die Ziele laufen also
  # weiter parallel zueinander; nur derselbe Workflow reiht sich auf. Wartende
  # Laeufe belegen keinen Runner, und kommt ein dritter Trigger, verwirft
  # GitHub den wartenden und behaelt den neuesten -- fuer den Badge richtig.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:


  # de233_fpu: xtensa mit FPU fuer float und double, also auch FMA.
  # gcc erzeugt dafuer erst ab 17 (Max Filippovs DFPU-Unterstuetzung) FPU-
  # Befehle fuer double; mit gcc 13 laufen add/sub/mul ueber libgcc, die
  # weder Rundungsmodi noch Ausnahme-Flags kennen. Toolchain und Kernel
  # sind kernspezifisch, beide fuer de233_fpu gebaut.
  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-xtensa-de233_fpu-gcc-17-pre-npt-shared
      gcc_prefix: xtensa-openadk-linux-uclibc-
      kernel_vers: 6.5.10
      kernel_dir: v6.x
      kernel_arch: xtensa
      config_file: config.xtensa_hf
      qemu_kernel: kernel-xtensa-fpu.img
      qemu_cmd: qemu-system-xtensa -M kc705 -cpu de233_fpu -m 128M -monitor null -nographic -kernel kernel.img

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit


  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit

  call_badge_failed:
    if: failure()
    needs: [call_build, call_images]
    uses: ./.github/workflows/z_badge_failed_workflow.yml
    with:
      build_result: ${{ needs.call_build.result }}
      images_result: ${{ needs.call_images.result }}
    secrets: inherit
