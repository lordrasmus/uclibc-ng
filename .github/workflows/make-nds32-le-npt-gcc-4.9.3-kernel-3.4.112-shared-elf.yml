name: nds32-le-npt-gcc-4.9.3-kernel-3.4.112-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master



jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-nds32le_nds32-gcc-4.9.3
      gcc_prefix: nds32le-openadk-linux-uclibc-
      kernel_vers: nds32-3.4.112
      kernel_dir: v3.x
      kernel_arch: nds32
      config_file: config.nds32le
      qemu_kernel:
      qemu_cmd:


  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit
