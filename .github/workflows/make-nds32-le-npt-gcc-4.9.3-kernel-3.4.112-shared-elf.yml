name: nds32-le-npt-gcc-4.9.3-kernel-3.4.112-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master



jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-nds32le_nds32-gcc-4.9.3
      gcc_prefix: nds32le-openadk-linux-uclibc-
      kernel_vers: nds32-3.4.112
      kernel_dir: v3.x
      kernel_arch: nds32
      config_file: config.nds32le
      qemu_kernel:
      qemu_cmd:

  # No call_images: this job only guards the uClibc build against the old
  # Andes BSP world (gcc-4.9.3 / binutils-2.24 / linux-3.4). nds32 has no
  # qemu, so the test rootfs is never booted, and busybox-1.36 pulls in
  # getrandom() which the 3.4 kernel/uClibc does not provide.
