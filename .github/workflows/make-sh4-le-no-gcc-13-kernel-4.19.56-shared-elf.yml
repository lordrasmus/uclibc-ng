name: sh4-le-no-gcc-13-kernel-4.19.56-shared-elf

# https://app.assembla.com/wiki/show/qemu-sh4/BuildingEnvironment/31

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

      
jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-sh4_sh4-gcc-13.4.0
      gcc_prefix: sh4-openadk-linux-uclibc-
      kernel_vers: 4.19.56
      kernel_dir: v4.x
      kernel_arch: sh
      config_file: config.sh4
      qemu_kernel: kernel-sh4.img
      qemu_cmd: qemu-system-sh4 -M r2d -m 1024M -kernel kernel.img -initrd rootfs.img.xz -nographic -serial vc

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit


  call_qemu:     
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit

  call_badge_failed:
    if: failure()
    needs: [call_build, call_images]
    uses: ./.github/workflows/z_badge_failed_workflow.yml
    with:
      build_result: ${{ needs.call_build.result }}
      images_result: ${{ needs.call_images.result }}
    secrets: inherit
