name: z_images_workflow

on:
  workflow_call:
    

jobs:
  build:
    runs-on: [self-hosted, uclibc-build]
    steps:

      - name: Ensure jq
        run: |
          # The LXC runners have jq pre-provisioned, a runner registered later
          # may not - and every step that reads infos.json needs it. Install
          # only when it is missing, so the 60 runners that share one apt lock
          # never touch apt.
          command -v jq >/dev/null && exit 0
          echo "jq missing, installing"
          sudo apt-get -y -qq update
          sudo apt-get -y -qq install jq

      - name: Cleanup workspace (self-hosted)
        run: |
          # Build-Reste entfernen, aber das .git behalten -> actions/checkout fetcht
          # nur Deltas statt komplett neu zu klonen (spart 40-250s checkout ueber die
          # geteilte GitHub-Leitung). clean:true von checkout deckt den Rest ab.
          find "${{ github.workspace }}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + 2>/dev/null || true

      - uses: actions/checkout@master
        with:
          fetch-depth: 1
          
      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts
    
      # Use the output from the reusable workflow to upload the artifacts
      - name: Infos
        run: |
           jq '.' infos.json
      
      - name: parse Config JSON
        id: parse-json
        run: |
          json=$(cat infos.json)
          for key in $(echo "$json" | jq -r 'keys[]'); do
            value=$(echo "$json" | jq -r ".$key")
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          

#      - name: Install dev packages
#        run: |
#          sudo apt-get update
#          sudo apt-get install tar

      - name: Install Toolchain
        run: |
           nice -n 19 tar -xaf $CONFIG_TOOLCHAIN.tar.xz

      - name: Isolate toolchain elf2flt.ld
        run: |
          # Same isolation as in z_build_workflow.yml: replace the
          # usr/<target>/lib symlink (which now points at sysroot/usr/lib
          # post pack.py-fix) with a real dir holding only elf2flt.ld, so
          # the toolchain's pre-built libc.so ldscript doesn't get picked
          # up over the freshly built uClibc-ng (e.g. aarch64: absolute
          # /lib/libc.so.1 in ldscript -> ld cannot find it).
          # Also re-expose the binutils ldscripts (needed by ld on arches
          # whose binutils doesn't embed them, e.g. nds32; no libc in there).
          shopt -s nullglob
          for L in "$CONFIG_TOOLCHAIN"/usr/*-*linux*/lib; do
            if [ -L "$L" ]; then
              rm "$L"
              mkdir -p "$L"
              SCRIPT="$CONFIG_TOOLCHAIN/sysroot/usr/lib/elf2flt.ld"
              [ -f "$SCRIPT" ] && cp "$SCRIPT" "$L/"
              [ -d "$CONFIG_TOOLCHAIN/sysroot/usr/lib/ldscripts" ] && ln -s ../../../sysroot/usr/lib/ldscripts "$L/ldscripts"
              echo "isolated: $L (elf2flt.ld + ldscripts)"
            fi
          done
          true

      - name: Drop fixincluded libc headers
        run: |
          # When gcc is built, fixincludes copies libc headers it wants to
          # patch into lib/gcc/<target>/<ver>/include-fixed/, which comes
          # BEFORE the sysroot on the include path.  For uClibc-ng it always
          # takes pthread.h (rule pthread_incomplete_struct_argument:
          # __sigsetjmp's "__env[1]").  That copy is the pthread.h of the
          # uClibc-ng the toolchain was built with, so the testsuite would
          # see it instead of the freshly built one in sysroot/: a function
          # added to pthread.h since then is "implicitly declared".  Only
          # files carrying fixincludes' header go; gcc's own limits.h,
          # syslimits.h and README stay.  uc_devel does the same
          # (drop_fixincluded_libc_headers in uc_dev/build.py).
          find "$CONFIG_TOOLCHAIN"/usr/lib/gcc/*/*/include-fixed -type f 2>/dev/null |
          while read -r F; do
            if head -c 512 "$F" | grep -q "auto-edited by fixincludes"; then
              rm "$F"
              echo "dropped fixincluded libc header: ${F##*include-fixed/}"
            fi
          done
          true

      - name: add PATH
        run: echo "$(pwd)/$CONFIG_TOOLCHAIN/usr/bin/" >> $GITHUB_PATH

      - name: extract Sysroot
        run: |
          nice -n 19 tar -xf sysroot.tar


      - name: init RootFS
        run: |
          mkdir -p rootfs/bin
          # The test runner is init: started as PID 1 it mounts devtmpfs,
          # proc, sysfs and tmpfs on /tmp and /dev/shm, grows the rootfs
          # tmpfs to 90 % (sh4/r2d ran out of room for the .out files at the
          # default half of RAM), runs the suite with -r and prints the
          # tests_start/tests_end markers read_test_log.py looks for, then
          # starts a shell.  No busybox init, inittab or run_tests.sh: on
          # noMMU every busybox exec cost a 2 MB block.
          # /sbin/init too: some kernels bring their own command line with
          # rdinit=/sbin/init (csky has it in the built-in device tree), and
          # busybox no longer provides one.
          mkdir -p rootfs/sbin
          ( cd rootfs ; ln -s /usr/lib/uclibc-ng-test/test/uclibcng-testrunner init )
          ( cd rootfs ; ln -s /usr/lib/uclibc-ng-test/test/uclibcng-testrunner sbin/init )
          ( cd rootfs ; mkdir dev; mkdir etc; mkdir proc; mkdir sys ; mkdir tmp )

          #           shared libs copy          #
          mkdir -p rootfs/usr/lib/
          cp -r sysroot/lib/ rootfs/ 
          if ls sysroot/usr/lib/*.so* 1>/dev/null 2>&1; then
              cp -a sysroot/usr/lib/*.so* rootfs/usr/lib/
          else
              echo "Keine .so Dateien in sysroot/usr/lib/ gefunden."
          fi
          
      
      - name: Build Testsuite
        run: |
          # ohne pipefail frisst "make | tee" den Exit-Code: ein kaputter
          # Suite-Build lief frueher als success durch und produzierte eine
          # rootfs voller fehlender Binaries (516 x exit 127)
          set -o pipefail
          echo "08:00:20:00:61:CA  pal"           > rootfs/etc/ethers
          echo "08:00:20:00:61:CB  192.168.11.2" >> rootfs/etc/ethers
          echo "08:00:20:00:61:CC  teeth"        >> rootfs/etc/ethers
          echo "127.0.0.1 localhost"              > rootfs/etc/hosts
          echo "root:x:0:"                        > rootfs/etc/group
          echo "root:x:0:0:root:/root:/bin/sh"    > rootfs/etc/passwd
          
          #git clone https://cgit.uclibc-ng.org/cgi/cgit/uclibc-ng-test.git/
          # per-Runner-Cache: Repo einmal klonen, danach nur Deltas fetchen statt
          # bei jedem Job komplett ueber die GitHub-Leitung neu zu klonen. In den
          # Workspace kopieren, damit "make install DESTDIR=../rootfs" relativ stimmt
          # und der Cache eine saubere Quelle bleibt.
          TESTREPO="/home/runner/cache/${RUNNER_NAME:-shared}/uclibc-ng-test"
          if [ -d "$TESTREPO/.git" ]; then
            git -C "$TESTREPO" fetch -q --depth=1 origin && git -C "$TESTREPO" reset -q --hard FETCH_HEAD && git -C "$TESTREPO" clean -qffdx
          else
            git clone -q --depth=1 https://github.com/lordrasmus/uclibc-ng-test.git "$TESTREPO"
          fi
          cp -a "$TESTREPO" uclibc-ng-test
          # What does not run, test/Makefile decides itself: it calls
          # get_disabled_tests.py with the CC and CFLAGS below and logs the
          # answer as "disabled by get_disabled_tests.py:".
          # FLAT-specific flags (mirror openadk mk/vars.mk):
          # -Wl,-elf2flt=-r triggers FLAT output through ld-elf2flt; for
          # rv32/rv64 the compiler also needs -fPIC so GOT slots get
          # R_RISCV_RELATIVE relocs that elf2flt can harvest.
          # noMMU without FLAT means the ELF_FDPIC loader, which can only load
          # position independent executables -- a plain ELF gives ENOEXEC at
          # exec time. Same flags openadk uses for that combination.
          FLAT_CFLAGS=""
          PIE_CFLAGS=""
          PIE_LDFLAGS=""
          STATIC_LDFLAGS=""
          if [[ $UCLIBC_FORMAT_FLAT == "y" ]] ; then
            # -s65536: elf2flt defaults to a 4 KB stack, and a bFLT stack cannot
            # grow -- it is a fixed slice of the one mapping that also holds
            # text, data and bss. test/unistd/clone.c alone declares 24 KB of
            # clone stacks as locals.
            FLAT_CFLAGS="-Wl,-elf2flt=-r -Wl,-elf2flt=-s65536"
            if [[ $UCLIBC_ARCH == riscv* ]] ; then
              # --no-relax: ld relaxes position independent sequences into absolute
              # ones once the target address fits a 12 bit immediate, which only
              # happens in small images -- and a bFLT is loaded at an arbitrary
              # base, so those addresses are wrong. It hit the register_tm_clones
              # pair that .init_array calls before main, so every small test binary
              # died with SIGSEGV. binutils 2.46 behaves exactly like 2.39 here:
              # from ld's point of view the link is a fixed address executable, so
              # saying no is our job.
              FLAT_CFLAGS="-fPIC -Wl,--no-relax $FLAT_CFLAGS"
            fi
            # h8300: gcc defaults to the plain H8/300 with 16-bit int, for
            # which the toolchain has neither libc.a nor libgcc.a ("cannot
            # find -lgcc").  Same -mh/-ms -mint32 Rules.mak builds uClibc-ng with.
            if grep -q '^CONFIG_H8300H=y' uclibc-ng-config 2>/dev/null ; then
              FLAT_CFLAGS="-mh -mint32 $FLAT_CFLAGS"
            elif grep -q '^CONFIG_H8S=y' uclibc-ng-config 2>/dev/null ; then
              FLAT_CFLAGS="-ms -mint32 $FLAT_CFLAGS"
            fi
          elif [[ $UCLIBC_MMU == "No" && $UCLIBC_FORMAT_ELF == "y" ]] ; then
            PIE_CFLAGS="-fpie"
            PIE_LDFLAGS="-fpie -pie"
          elif ! ls sysroot/lib/libc.so* >/dev/null 2>&1 ; then
            # A static-only libc comes with a static-only toolchain, which has
            # no libgcc_s.so. Without -static gcc uses the shared-libgcc link
            # spec, pulls the unwinder out of libgcc.a only after -lc has been
            # scanned, and its dl_iterate_phdr stays undefined -- which killed
            # test/pthread on riscv64 as soon as those tests stopped being
            # disabled. -static picks the spec that keeps libc available.
            STATIC_LDFLAGS="-static"
          fi
          # ColdFire needs the large GOT model, a full rootfs overflows the
          # 16 bit one ("R_68K_GOT16O truncated to fit"). Ask the compiler:
          # m68k is also the 68040 target, which does not want these.
          CF_CFLAGS=""
          if ${CONFIG_GCC_PREFIX}gcc -dM -E - < /dev/null 2>/dev/null | grep -q __mcoldfire__ ; then
            CF_CFLAGS="-mxgot -fno-dwarf2-cfi-asm"
          fi
          # xtensa/kvx/csky/arc embed the rootfs cpio in a fixed-size kernel
          # slot (the cpio hack, ~17 MB); the -O2 twins roughly double the test
          # binaries and overflow it. O2_TWINS=0 on the make command line
          # overrides the per-directory O2_TWINS:=1 and skips the twins there.
          MK_FLAGS=""
          case "$CONFIG_KERNEL_ARCH" in
            xtensa|kvx|csky|arc) MK_FLAGS="O2_TWINS=0" ;;
          esac
          # ColdFire's mcf5208evb has no initrd support either, so it uses the
          # same slot -- 24 MB in that image. Keyed on the machine and on ELF,
          # not on the arch: m68k is also the 68040 virt target, which does use
          # -initrd, and the FLAT target on the same machine still fits with
          # the twins because its binaries are smaller. The ELF one overflowed
          # at 26287104 bytes against the 25165824 the slot holds.
          if [[ $CONFIG_QEMU_CMD == *mcf5208* && $UCLIBC_FORMAT_ELF == "y" ]] ; then
            MK_FLAGS="O2_TWINS=0"
          fi
          CROSS_COMPILE=$CONFIG_GCC_PREFIX CFLAGS="--sysroot=$(pwd)/sysroot/ $FLAT_CFLAGS $PIE_CFLAGS $CF_CFLAGS" LDFLAGS="--sysroot=$(pwd)/sysroot/ $FLAT_CFLAGS $PIE_LDFLAGS $STATIC_LDFLAGS $CF_CFLAGS"   nice -n 19 make -C uclibc-ng-test -j20 $MK_FLAGS 2>&1  | tee  testsuite_build.log
          CROSS_COMPILE=$CONFIG_GCC_PREFIX CFLAGS="--sysroot=$(pwd)/sysroot/ $FLAT_CFLAGS $PIE_CFLAGS $CF_CFLAGS" LDFLAGS="--sysroot=$(pwd)/sysroot/ $FLAT_CFLAGS $PIE_LDFLAGS $STATIC_LDFLAGS $CF_CFLAGS"   make -C uclibc-ng-test install DESTDIR=../rootfs $MK_FLAGS > /dev/null 2>&1
          echo "### Disabled Tests :bulb:" >> $GITHUB_STEP_SUMMARY
          grep -m1 "disabled by get_disabled_tests.py:" testsuite_build.log >> "$GITHUB_STEP_SUMMARY" || true
          find rootfs -type f -name '*.gdb' -exec rm {} \;
          # The same targets also strip the test binaries: their symbol tables
          # are 9-18 % of the suite, and arc and xtensa no longer fit the slot
          # with them.  strip leaves non-ELF files (scripts, FLAT) untouched.
          if [[ -n $MK_FLAGS ]] ; then
            echo "rootfs before strip: $(du -sb rootfs | cut -f1)"
            find rootfs/usr/lib/uclibc-ng-test -type f -exec ${CONFIG_GCC_PREFIX}strip --strip-unneeded {} + 2>/dev/null || true
            echo "rootfs after strip:  $(du -sb rootfs | cut -f1)"
          fi

      
      
      - name: Build Busybox
        run: |
          #wget -nv https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          wget -nv  https://raw.githubusercontent.com/lordrasmus/toolchains/main/busybox-1.36.1.tar.bz2
          nice -n 19 tar -xaf busybox-1.36.1.tar.bz2
          # Only what the guest still runs: the shell for popen(), system()
          # and posix_spawn() in the tests, ls and true for the two vfork
          # tests, reboot for an interactive look.  init, getty and the rest
          # are gone with the test runner as /init -- 149 KB instead of
          # 1.1 MB on riscv32 noMMU.  LFS because uClibc-ng forces a 64 bit
          # off_t, ASH_INTERNAL_GLOB because ash refuses uClibc's glob().
          make -C busybox-1.36.1/ allnoconfig > /dev/null
          OPTS="LFS LS TRUE ECHO TEST KILL REBOOT POWEROFF FEATURE_EDITING"
          if [[ $UCLIBC_MMU == "No" ]] ; then
            OPTS="$OPTS NOMMU SHELL_HUSH HUSH SH_IS_HUSH HUSH_INTERACTIVE HUSH_ECHO HUSH_TEST HUSH_READ HUSH_KILL HUSH_EXPORT HUSH_TRAP"
          else
            OPTS="$OPTS SHELL_ASH ASH SH_IS_ASH ASH_ECHO ASH_TEST ASH_INTERNAL_GLOB"
          fi
          for o in $OPTS ; do
            sed -i "s|^# CONFIG_$o is not set|CONFIG_$o=y|" busybox-1.36.1/.config
          done
          sed -i 's/CONFIG_CROSS_COMPILER_PREFIX=""/CONFIG_CROSS_COMPILER_PREFIX="'$CONFIG_GCC_PREFIX'"/' busybox-1.36.1/.config
          sed -i 's|CONFIG_SYSROOT=""|CONFIG_SYSROOT="'$(pwd)'/sysroot/"|' busybox-1.36.1/.config
          sed -i 's|CONFIG_PREFIX="./_install"|CONFIG_PREFIX="../rootfs"|'  busybox-1.36.1/.config

          if [[ $UCLIBC_VDSO == "No" ]] ; then
            if [[ $UCLIBC_MMU == "No" && $UCLIBC_FORMAT_ELF == "y" ]] ; then
              # -static would override the -pie below, and noMMU ELF must be PIE
              echo "noMMU ELF: not forcing CONFIG_STATIC (would defeat -pie)"
            else
              sed -i 's|# CONFIG_STATIC is not set|CONFIG_STATIC=y|'  busybox-1.36.1/.config
            fi
          fi
          
          if [[ $UCLIBC_ARCH == "xtensa" ]] ; then
            sed -i 's|CONFIG_EXTRA_CFLAGS=".*"|CONFIG_EXTRA_CFLAGS="-mlongcalls"|g'  busybox-1.36.1/.config
          fi
          
          # Settle the dependencies of the symbols switched on above; without
          # a terminal the build would otherwise stop and ask.
          yes '' | make -C busybox-1.36.1 oldconfig > /dev/null
          grep -E "^CONFIG_(SH_IS_|NOMMU|STATIC|LFS)" busybox-1.36.1/.config

          # ColdFire: large GOT model, see the testsuite step. Separate shell
          # step, so the probe has to be repeated here.
          CF_CFLAGS=""
          if ${CONFIG_GCC_PREFIX}gcc -dM -E - < /dev/null 2>/dev/null | grep -q __mcoldfire__ ; then
            CF_CFLAGS=" -mxgot -fno-dwarf2-cfi-asm"
          fi
          if [[ $UCLIBC_FORMAT_FLAT == "y" ]] ; then
            # FLAT needs -Wl,-elf2flt=-r at link time; rv32/rv64 additionally
            # need -fPIC so GOT slots get R_RISCV_RELATIVE relocs that elf2flt
            # can harvest (without -fPIC the static link bakes absolute VMAs
            # into the GOT and binfmt_flat can't fix them up at load time).
            FLAT_CFLAGS="-Wl,-elf2flt=-r"
            if [[ $UCLIBC_ARCH == riscv* ]] ; then
              FLAT_CFLAGS="-fPIC $FLAT_CFLAGS"
            fi
            # h8300: -mh/-ms -mint32, see the testsuite step
            if grep -q '^CONFIG_H8300H=y' uclibc-ng-config 2>/dev/null ; then
              FLAT_CFLAGS="-mh -mint32 $FLAT_CFLAGS"
            elif grep -q '^CONFIG_H8S=y' uclibc-ng-config 2>/dev/null ; then
              FLAT_CFLAGS="-ms -mint32 $FLAT_CFLAGS"
            fi
            # Compose with any existing CONFIG_EXTRA_CFLAGS (e.g. xtensa -mlongcalls)
            ESC=$(printf '%s\n' "$FLAT_CFLAGS$CF_CFLAGS" | sed 's/[\/&]/\\&/g')
            sed -i 's|^CONFIG_EXTRA_CFLAGS="\(.*\)"$|CONFIG_EXTRA_CFLAGS="\1 '"$ESC"'"|'  busybox-1.36.1/.config
            sed -i 's|^CONFIG_EXTRA_LDFLAGS="\(.*\)"$|CONFIG_EXTRA_LDFLAGS="\1 '"$ESC"'"|' busybox-1.36.1/.config
            echo "FLAT busybox build: CFLAGS+=$FLAT_CFLAGS"
            grep -E "^CONFIG_EXTRA_(C|LD)FLAGS=" busybox-1.36.1/.config
            SKIP_STRIP=y nice -n 19 make -C busybox-1.36.1 -j20 busybox
            SKIP_STRIP=y make -C busybox-1.36.1/ install > /dev/null
          elif [[ $UCLIBC_MMU == "No" && $UCLIBC_FORMAT_ELF == "y" ]] ; then
            # noMMU + ELF: the FDPIC loader only takes position independent
            # executables, see the testsuite step above.
            sed -i 's|^CONFIG_EXTRA_CFLAGS="\(.*\)"$|CONFIG_EXTRA_CFLAGS="\1 -fpie'"$CF_CFLAGS"'"|'  busybox-1.36.1/.config
            sed -i 's|^CONFIG_EXTRA_LDFLAGS="\(.*\)"$|CONFIG_EXTRA_LDFLAGS="\1 -fpie -pie"|' busybox-1.36.1/.config
            echo "PIE busybox build (noMMU, ELF)"
            grep -E "^CONFIG_EXTRA_(C|LD)FLAGS=" busybox-1.36.1/.config
            SKIP_STRIP=0 nice -n 19 make -C busybox-1.36.1 -j20 busybox
            SKIP_STRIP=0 make -C busybox-1.36.1/ install > /dev/null
          else
            SKIP_STRIP=0 nice -n 19 make -C busybox-1.36.1 -j20 busybox
            SKIP_STRIP=0 make -C busybox-1.36.1/ install > /dev/null
          fi
          
          
      - name: Build RootFS Image
        run: |
          ( cd rootfs ; ln -s lib lib32 )
          ( cd rootfs ; ln -s lib lib64 )
          ( cd rootfs ; ln -s lib libx32 )
          ( cd rootfs/usr ; ln -s lib lib32 )
          ( cd rootfs/usr ; ln -s lib lib64 )
          ( cd rootfs/usr ; ln -s lib libx32 )
          ( cd rootfs ; find . | sort | cpio -o -H newc ) > rootfs.img
          nice -n 19 xz --check=crc32 -k rootfs.img
          # h8300's edosk2674 has 14 MiB of RAM in a 16 MiB address space: the
          # rootfs cannot be an initramfs there and comes as an ext2 disk on
          # virtio instead.  Built for every target whose qemu command names it,
          # twice the rootfs size plus room for the .out files.  The size is
          # the apparent one: on a compressing file system (the runners sit on
          # ZFS) plain du reports far less than the files hold.
          if [[ $CONFIG_QEMU_CMD == *rootfs.ext2* ]] ; then
            SIZE=$(du -sm --apparent-size rootfs | cut -f1)
            mke2fs -q -t ext2 -b 1024 -d rootfs rootfs.ext2 $((SIZE * 2 + 32))M
            echo "rootfs.ext2: $(du -h --apparent-size rootfs.ext2 | cut -f1) for ${SIZE} MB"
          fi

      - name: Fetch Qemu Kernel Image
        run: |
          if [[ ! ${CONFIG_QEMU_KERNEL} == "" ]] ; then
            # Pull straight from raw.githubusercontent (no github.com /blob
            # redirect, which can hand back a 200 HTML page on a rate limit);
            # retry with backoff and require a non-empty file.
            base="https://raw.githubusercontent.com/lordrasmus/uclibc-ng-qemu-imgs/main"
            fetch() {   # $1 remote name, $2 local name
              for i in 1 2 3 4 5; do
                if wget -nv --timeout=30 "$base/$1" -O "$2" && [ -s "$2" ]; then
                  return 0
                fi
                echo "fetch $1 failed (attempt $i), retrying..." >&2
                sleep $((i*10))
              done
              echo "ERROR: could not fetch $1" >&2
              return 1
            }
            fetch "${CONFIG_QEMU_KERNEL}" kernel.img
            fetch "${CONFIG_QEMU_KERNEL%.img}.config" kernel.config
          else
            echo "No Qemu Kernel configured"
          fi
            
          
      - name: Qemu Testsuite run command
        run: |
          echo "### Qemu run command :bulb:" >> $GITHUB_STEP_SUMMARY
          echo "$CONFIG_QEMU_CMD" >> $GITHUB_STEP_SUMMARY

      - name: upload RootFS Image
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          overwrite: true
          path: |
            kernel.img
            kernel.config
            rootfs.img
            rootfs.img.xz
            rootfs.ext2
            infos.json  
            linux-*
            sysroot.tar  
            toolchain-*.tar.xz
            uclibc-ng-config
            
     
      - name: upload testsuite_build.log
        uses: actions/upload-artifact@v4
        with:
          name: testsuite_build.log
          path: testsuite_build.log
          
      
      # Stays push-only, unlike the two badge uploads: a dev pack is ~265 MB
      # per target, some 7 GB per matrix, and a test-suite commit does not
      # change the library it holds. Not a question of what may be published
      # but of what is worth uploading twice -- do not "harmonise" this with
      # the badge condition.
      - name: create Devel Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          UPLOAD_KEY: ${{ secrets.UPLOAD_KEY }} 
        run: |
          export devel_name=devel_pack_${{ github.workflow }}
          mkdir -p $devel_name/files/
          nice -n 19 xz -e -9 sysroot.tar
          cp $CONFIG_TOOLCHAIN.tar.xz $devel_name/files/
          cp sysroot.tar.xz $devel_name/files/
          cp busybox-1.36.1.tar.bz2 $devel_name/files/
          cp rootfs.img* $devel_name/files/
          cp uclibc-ng-config $devel_name/files/
          if [ -e kernel.img ] ; then cp kernel.img $devel_name/files/ ; fi
          if [ -e kernel.config ] ; then cp kernel.config $devel_name/files/ ; fi
          cp linux-$CONFIG_KERNEL_VERS.tar.xz $devel_name/files/
          
          cp infos.json $devel_name
          
          nice -n 19 tar -cf $devel_name.tar $devel_name
          
          python3 .github/tools/upload.py $devel_name.tar
          
        


