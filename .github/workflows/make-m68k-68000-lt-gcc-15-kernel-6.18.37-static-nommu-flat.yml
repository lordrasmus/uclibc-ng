name: m68k-68000-lt-gcc-15-kernel-6.18.37-static-nommu-flat

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master


concurrency:
  # Zwei Laeufe desselben Ziels duerfen sich nicht ueberholen: der Badge ist
  # eine Datei auf dem Server, es gewinnt also der, der spaeter fertig wird --
  # nicht der mit dem neueren Commit. Am 2026-08-26 hat so ein dispatch-Lauf
  # auf dem aelteren Commit den gruenen Badge eines Pushs ueberschrieben, eine
  # Minute nach ihm. Die Gruppe ist (Workflow, Ref), die Ziele laufen also
  # weiter parallel zueinander; nur derselbe Workflow reiht sich auf. Wartende
  # Laeufe belegen keinen Runner, und kommt ein dritter Trigger, verwirft
  # GitHub den wartenden und behaelt den neuesten -- fuer den Badge richtig.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-m68k-68000-gcc-15.3.0-lt-static-nommu-flat
      gcc_prefix: m68k-openadk-uclinux-uclibc-
      kernel_vers: 6.18.37
      kernel_dir: v6.x
      kernel_arch: m68k
      config_file: config.m68k_68000
      qemu_kernel: kernel-m68k-68000.img
      # The m68328 machine of the qemu fork: a 68000 with the MC68328's
      # interrupt controller and timer. The rootfs goes in uncompressed,
      # without an MMU the kernel cannot allocate the xz dictionary.
      qemu_cmd: qemu-system-m68k -M m68328 -nographic -kernel kernel.img -initrd rootfs.img -append console=ttyS0,115200

  # What this target is for: the 68000 and 68010 have no CAS, so they take the
  # kernel helper path in bits/atomic.h that ColdFire uses. That path had no
  # coverage here - every other m68k toolchain is 68040 or ColdFire - until a
  # Buildroot autobuilder found it.

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit

  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit

  call_badge_failed:
    if: failure()
    needs: [call_build, call_images]
    uses: ./.github/workflows/z_badge_failed_workflow.yml
    with:
      build_result: ${{ needs.call_build.result }}
      images_result: ${{ needs.call_images.result }}
    secrets: inherit
