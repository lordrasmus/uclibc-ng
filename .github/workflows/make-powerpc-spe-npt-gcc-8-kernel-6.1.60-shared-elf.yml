name: powerpc-spe-npt-gcc-8-kernel-6.1.60-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

      


concurrency:
  # Zwei Laeufe desselben Ziels duerfen sich nicht ueberholen: der Badge ist
  # eine Datei auf dem Server, es gewinnt also der, der spaeter fertig wird --
  # nicht der mit dem neueren Commit. Am 2026-08-26 hat so ein dispatch-Lauf
  # auf dem aelteren Commit den gruenen Badge eines Pushs ueberschrieben, eine
  # Minute nach ihm. Die Gruppe ist (Workflow, Ref), die Ziele laufen also
  # weiter parallel zueinander; nur derselbe Workflow reiht sich auf. Wartende
  # Laeufe belegen keinen Runner, und kommt ein dritter Trigger, verwirft
  # GitHub den wartenden und behaelt den neuesten -- fuer den Badge richtig.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-ppc-8548-gcc-8.5.0-npt-shared-hard
      gcc_prefix: ppc-openadk-linux-uclibcspe-
      kernel_vers: 6.1.60
      kernel_dir: v6.x
      kernel_arch: powerpc
      config_file: config.powerpc-spe
      qemu_kernel: kernel-ppc-e500.img
      # e500v2 with SPE on qemu's paravirt e500 board; the rootfs is an ext2
      # disk on virtio-blk-pci (see kernel-ppc-e500.README in the imgs repo).
      qemu_cmd: qemu-system-ppc -M ppce500 -cpu e500v2 -m 512M -nographic -nic none -kernel kernel.img -drive if=none,id=hd,format=raw,file=rootfs.ext2 -device virtio-blk-pci,drive=hd -append "console=ttyS0 root=/dev/vda rootfstype=ext2 rw"

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit



  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit

  call_badge_failed:
    if: failure()
    needs: [call_build, call_images]
    uses: ./.github/workflows/z_badge_failed_workflow.yml
    with:
      build_result: ${{ needs.call_build.result }}
      images_result: ${{ needs.call_images.result }}
    secrets: inherit
