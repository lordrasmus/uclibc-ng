name: loongarch64-npt-gcc-16-kernel-6.18.37-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master


concurrency:
  # Zwei Laeufe desselben Ziels duerfen sich nicht ueberholen: der Badge ist
  # eine Datei auf dem Server, es gewinnt also der, der spaeter fertig wird --
  # nicht der mit dem neueren Commit. Am 2026-08-26 hat so ein dispatch-Lauf
  # auf dem aelteren Commit den gruenen Badge eines Pushs ueberschrieben, eine
  # Minute nach ihm. Die Gruppe ist (Workflow, Ref), die Ziele laufen also
  # weiter parallel zueinander; nur derselbe Workflow reiht sich auf. Wartende
  # Laeufe belegen keinen Runner, und kommt ein dritter Trigger, verwirft
  # GitHub den wartenden und behaelt den neuesten -- fuer den Badge richtig.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-loongarch64-gcc-16.2.0
      gcc_prefix: loongarch64-openadk-linux-uclibc-
      kernel_vers: 6.18.37
      kernel_dir: v6.x
      kernel_arch: loongarch
      config_file: config.loongarch64
      qemu_kernel: kernel-loongarch64.img
      qemu_cmd: qemu-system-loongarch64 -M virt -m 1G -smp 4 -nographic -kernel kernel.img -initrd rootfs.img.xz -append console=ttyS0,115200

  # The loongarch64 port came in with d2e31f069 (Bernhard Rosenkraenzer, via
  # Waldemar) after 1.0.59, so the toolchain is built by openadk against
  # uClibc-ng from git; gcc itself knows LoongArch only with glibc and musl,
  # openadk's loongarch-uclibc.patch adds the triplet.
  #
  # The config is riscv64_shared with the target swapped: 64 bit, NPTL,
  # shared, so a failure has the arch as its first suspect.
  #
  # qemu-system-loongarch64 in qemu-inst.tar.xz is 11.1.0. The 8.1.2 one
  # before it needed edk2 firmware and took 69 s to boot with more than one
  # CPU; 11.1.0 boots the EFI zboot image directly. That image has to be
  # gzip, qemu's loader refuses zboot with zstd.

  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit

  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit

  call_badge_failed:
    if: failure()
    needs: [call_build, call_images]
    uses: ./.github/workflows/z_badge_failed_workflow.yml
    with:
      build_result: ${{ needs.call_build.result }}
      images_result: ${{ needs.call_images.result }}
    secrets: inherit
