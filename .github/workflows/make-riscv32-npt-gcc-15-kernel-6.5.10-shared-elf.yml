name: riscv32-npt-gcc-15-kernel-6.5.10-shared-elf

on:
  workflow_dispatch:
  repository_dispatch:
    types: [test-update]
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master



jobs:

  call_build:
    uses: ./.github/workflows/z_build_workflow.yml
    with:
      toolchain: toolchain-riscv32-gcc-15.3.0
      gcc_prefix: riscv32-openadk-linux-uclibc-
      kernel_vers: 6.5.10
      kernel_dir: v6.x
      kernel_arch: riscv
      config_file: config.riscv32_shared
      qemu_kernel: kernel-riscv32.img
      qemu_cmd: qemu-system-riscv32 -M virt -nographic -kernel kernel.img -initrd rootfs.img


  call_images:
    needs: call_build
    uses: ./.github/workflows/z_images_workflow.yml
    secrets: inherit

  call_qemu:
    needs: call_images
    uses: ./.github/workflows/z_qemu_test_run.yml
    secrets: inherit
